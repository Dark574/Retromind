name: Retromind CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retromind-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Retromind.sln

      - name: Build release configuration
        run: dotnet build Retromind.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/Retromind.Tests/Retromind.Tests.csproj --configuration Release --no-build --no-restore

      - name: Check AppImage environment scripts
        run: |
          sh -n build/configure-bookworm-snapshot.sh
          sh -n build/upgrade-bookworm-packages.sh
          sh -n build/update-appimage-environment.sh
          python3 -B -m unittest discover -s build/tests -v
